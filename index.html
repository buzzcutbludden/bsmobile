<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brawl Stars: Power Cube Survival</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none; }
body { overflow:hidden; background:#1a1a2e; font-family:'Arial',sans-serif; }
#gameCanvas { display:block; background:#2d5a27; }
#ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
#enemyHealthContainer { position:absolute; top:10px; right:10px; width:200px; text-align:right; }
#enemyName { color:#fff; font-size:14px; font-weight:bold; margin-bottom:2px; text-shadow:1px 1px 2px #000; }
.health-bar-container { width:200px; height:20px; background:rgba(0,0,0,0.5); border-radius:10px; overflow:hidden; border:2px solid #fff; display:inline-block; }
.health-bar { height:100%; transition:width 0.3s; }
#enemyHealthBar { background:linear-gradient(90deg,#ff4444,#cc0000); width:100%; }
#powerCubeDisplay { position:absolute; top:40px; left:10px; color:#ffcc00; font-size:20px; font-weight:bold; text-shadow:2px 2px 4px rgba(0,0,0,0.8); display:flex; align-items:center; gap:5px; }
#zoneTimer { position:absolute; top:40px; left:50%; transform:translateX(-50%); color:#ff6b6b; font-size:18px; font-weight:bold; text-shadow:2px 2px 4px rgba(0,0,0,0.8); background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:20px; }
#minimap { position:absolute; top:100px; right:10px; width:150px; height:150px; background:rgba(0,0,0,0.7); border:3px solid #fff; border-radius:10px; pointer-events:auto; }
#movement-joystick { position:absolute; bottom:100px; left:50px; width:120px; height:120px; pointer-events:auto; }
.joystick-base { position:absolute; width:100%; height:100%; background:rgba(255,255,255,0.15); border:3px solid rgba(255,255,255,0.4); border-radius:50%; }
.joystick-knob { position:absolute; width:50px; height:50px; background:rgba(0,150,255,0.8); border:3px solid #fff; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 20px rgba(0,150,255,0.6); }
#attack-joystick { position:absolute; bottom:100px; right:20px; width:120px; height:120px; pointer-events:auto; }
#attack-joystick .joystick-knob { background:rgba(255,100,100,0.8); box-shadow:0 0 20px rgba(255,100,100,0.6); }
#attackHint { position:absolute; bottom:228px; right:20px; width:120px; text-align:center; color:rgba(255,255,255,0.55); font-size:10px; pointer-events:none; }
#soundToggle { position:absolute; bottom:270px; right:20px; width:40px; height:40px; background:rgba(255,255,255,0.2); border:2px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; pointer-events:auto; cursor:pointer; }
#score { position:absolute; top:70px; left:50%; transform:translateX(-50%); color:white; font-size:18px; font-weight:bold; text-shadow:2px 2px 4px rgba(0,0,0,0.8); }
#controlsHint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.7); font-size:12px; text-align:center; }
#gameOver { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; flex-direction:column; pointer-events:auto; z-index:1000; }
#gameOver h1 { color:#fff; font-size:48px; margin-bottom:20px; }
#restartBtn { padding:15px 40px; font-size:20px; background:#4ecdc4; border:none; border-radius:10px; color:white; cursor:pointer; }
#poisonWarning { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff00ff; font-size:32px; font-weight:bold; text-shadow:0 0 20px #ff00ff; display:none; animation:pulse 0.5s infinite; }
#lowHealthWarning { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); color:#ff2222; font-size:28px; font-weight:bold; text-shadow:0 0 20px #ff0000; display:none; animation:pulse 0.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
@media(max-width:768px){
  #movement-joystick{bottom:80px;left:30px;width:100px;height:100px;}
  #attack-joystick{bottom:80px;right:10px;width:100px;height:100px;}
  .joystick-knob{width:40px;height:40px;}
  #soundToggle{bottom:220px;right:10px;}
  #attackHint{right:10px;width:100px;}
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="enemyHealthContainer">
    <div id="enemyName">Strongest Enemy</div>
    <div class="health-bar-container"><div class="health-bar" id="enemyHealthBar"></div></div>
  </div>
  <div id="powerCubeDisplay"><span>📦</span> <span id="cubeCount">0</span></div>
  <div id="zoneTimer">🟢 Safe Zone: <span id="zoneSize">100</span>%</div>
  <div id="score">Alive: <span id="enemyCount">10</span>/10</div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="movement-joystick"><div class="joystick-base"></div><div class="joystick-knob" id="moveKnob"></div></div>
  <div id="attack-joystick"><div class="joystick-base"></div><div class="joystick-knob" id="attackKnob"></div></div>
  <div id="attackHint">tap=fire · drag=aim</div>
  <div id="soundToggle">🔊</div>
  <div id="poisonWarning">⚠️ POISON ZONE ⚠️</div>
  <div id="lowHealthWarning">❤️ LOW HEALTH ❤️</div>
  <div id="controlsHint">Left: Move | Right: Aim | Hunt Power Cubes! Avoid Poison!</div>
</div>
<div id="gameOver"><h1 id="gameOverText">GAME OVER</h1><button id="restartBtn">RESTART</button></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const minimapCtx = minimap.getContext('2d');
const MAP_SIZE = 10000;
const TILE_SIZE = 100;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Sound
// ---------------------------------------------------------------------------
const Sound = {
  enabled: true, ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(freq, dur, type='square', vol=0.3) {
    if (!this.enabled || !this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.connect(g); g.connect(this.ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
    o.start(this.ctx.currentTime); o.stop(this.ctx.currentTime + dur);
  },
  shoot()      { this.play(400,0.1,'square',0.2); setTimeout(()=>this.play(300,0.1,'square',0.15),50); },
  hit()        { this.play(150,0.15,'sawtooth',0.3); },
  collect()    { this.play(800,0.1,'sine',0.3); setTimeout(()=>this.play(1000,0.15,'sine',0.3),100); },
  boxBreak()   { this.play(200,0.2,'square',0.4); setTimeout(()=>this.play(150,0.3,'square',0.3),100); },
  poison()     { this.play(100,0.3,'sawtooth',0.2); },
  enemyDeath() { this.play(300,0.2,'square',0.3); setTimeout(()=>this.play(200,0.3,'square',0.2),150); },
  reload()     { this.play(600,0.05,'sine',0.1); },
  empty()      { this.play(150,0.05,'square',0.1); },
  toggle()     { this.enabled=!this.enabled; document.getElementById('soundToggle').textContent=this.enabled?'🔊':'🔇'; }
};

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
let gameRunning = true;

const poisonZone = { radius: MAP_SIZE*0.7, minRadius:500, shrinkRate:1.0, damage:0.5, shrinking:false, shrinkDelay:150, warning:false };
const camera = { x:0, y:0 };

const input = { moveX:0, moveY:0, aimX:0, aimY:0, attacking:false };
const moveJoystick  = { active:false, originX:0, originY:0, maxDist:35 };
const attackJoystick = { active:false, originX:0, originY:0, maxDist:35 };

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
const player = {
  x:MAP_SIZE/2, y:MAP_SIZE/2, radius:25,
  speed:8.0,
  health:180, maxHealth:180, baseHealth:180,
  damage:110, baseDamage:110,
  powerCubes:0, color:'#00a8ff', angle:0,
  lastAttack:0, attackCooldown:150,
  inPoison:false,
  ammo:3, maxAmmo:3, reloadTimer:0, reloadTime:75,
  lastCombatTime:0
};

// ---------------------------------------------------------------------------
// World
// ---------------------------------------------------------------------------
const walls = [];
for (let i=0;i<250;i++) {
  let wx, wy, ww, wh;
  let valid = false;
  let attempts = 0;
  while (!valid && attempts < 100) {
    wx = Math.random()*(MAP_SIZE-200)+100;
    wy = Math.random()*(MAP_SIZE-200)+100;
    ww = Math.random()*150+50;
    wh = Math.random()*150+50;
    attempts++;
    valid = true;
    const centerX = MAP_SIZE/2;
    const centerY = MAP_SIZE/2;
    const dist = Math.hypot(wx - centerX, wy - centerY);
    if (dist < 400) valid = false;
  }
  walls.push({ x:wx, y:wy, width:ww, height:wh });
}

let projectiles = [];
const boxes=[], powerCubes=[];
const NUM_BOXES=60;
for (let i=0;i<NUM_BOXES;i++) spawnBox();

function spawnBox() {
  if (boxes.length>=NUM_BOXES) return;
  let x,y,valid,attempts=0;
  do {
    valid=true; x=Math.random()*(MAP_SIZE-100)+50; y=Math.random()*(MAP_SIZE-100)+50;
    for (let w of walls) { if (x>w.x-50&&x<w.x+w.width+50&&y>w.y-50&&y<w.y+w.height+50){valid=false;break;} }
    attempts++;
  } while (!valid&&attempts<100);
  boxes.push({x,y,width:40,height:40,health:30,maxHealth:30});
}

function spawnPowerCube(x,y) { powerCubes.push({x,y,radius:12,value:1,floatOffset:Math.random()*Math.PI*2}); }

// ---------------------------------------------------------------------------
// Enemy types - BUFFED STATS
// ---------------------------------------------------------------------------
const enemyTypes = [
  // Tank: More HP, hits harder
  { name:'Tank',    health:700, speed:5.2, damage:55,  color:'#487eb0', radius:30, attackPattern:'single',  maxAmmo:3, reloadTime:65,  attackCooldown:250 },
  // Sniper: More damage, faster
  { name:'Sniper',  health:450, speed:6.2, damage:180, color:'#e74c3c', radius:20, attackPattern:'sniper',  maxAmmo:1, reloadTime:100, attackCooldown:250, sightRange:950 },
  // Shotgun: Significantly more damage, faster approach
  { name:'Shotgun', health:600, speed:6.8, damage:38,  color:'#f39c12', radius:25, attackPattern:'shotgun', maxAmmo:4, reloadTime:80,  attackCooldown:275 },
  // Volley: More durable, hits harder
  { name:'Volley',  health:550, speed:6.0, damage:34,  color:'#9b59b6', radius:22, attackPattern:'volley',  maxAmmo:5, reloadTime:55,  attackCooldown:250 },
  // Rapid: Fastest, decent damage buff
  { name:'Rapid',   health:620, speed:7.6, damage:30,  color:'#2ecc71', radius:23, attackPattern:'rapid',   maxAmmo:8, reloadTime:35,  attackCooldown:225 }
];

const enemies=[];
for (let i=0;i<10;i++) spawnEnemy();

function spawnEnemy() {
  const type = enemyTypes[Math.floor(Math.random()*enemyTypes.length)];
  let x,y,valid,attempts=0;
  const safeR = poisonZone.radius*0.5;
  do {
    valid=true;
    const a=Math.random()*Math.PI*2, d=Math.random()*safeR;
    x=MAP_SIZE/2+Math.cos(a)*d; y=MAP_SIZE/2+Math.sin(a)*d;
    if (Math.hypot(x-player.x,y-player.y)<1500) valid=false;
    for (let w of walls) { if (x>w.x-50&&x<w.x+w.width+50&&y>w.y-50&&y<w.y+w.height+50){valid=false;break;} }
    attempts++;
  } while (!valid&&attempts<100);
  enemies.push({
    x,y,...type, baseHealth:type.health, baseDamage:type.damage, maxHealth:type.health,
    powerCubes:0, lastAttack:0, angle:0,
    state:'roam', roamTarget:{x:Math.random()*MAP_SIZE,y:Math.random()*MAP_SIZE},
    roamTimer:0, inPoison:false, lastCombatTime:0,
    stuckTimer:0, strafeOffset:Math.random()*100,
    ammo:type.maxAmmo, reloadTimer:0,
    rivalTarget:null, rivalLockTimer:0,
    teamId:null, spreadAngle:Math.random()*Math.PI*2
  });
}

// ---------------------------------------------------------------------------
// Touch controls
// ---------------------------------------------------------------------------
const moveEl=document.getElementById('movement-joystick'), moveKnob=document.getElementById('moveKnob');
const atkEl=document.getElementById('attack-joystick'),   atkKnob=document.getElementById('attackKnob');
let moveTouchId=-1, atkTouchId=-1, atkStartX=0, atkStartY=0, atkDragged=false;
const TAP_THRESHOLD=12;

function updateJoystick(cx,cy,joystick,knob,cb) {
  const dx=cx-joystick.originX, dy=cy-joystick.originY;
  const dist=Math.min(Math.hypot(dx,dy),joystick.maxDist), a=Math.atan2(dy,dx);
  const kx=Math.cos(a)*dist, ky=Math.sin(a)*dist;
  knob.style.transform=`translate(calc(-50% + ${kx}px),calc(-50% + ${ky}px))`;
  if (cb) cb(kx/joystick.maxDist, ky/joystick.maxDist);
}

// Auto-aim: Prioritize Enemies, then Cubes.
function findAutoAimTarget() {
  const range = 700; 
  let nearestEnemy = null, nearestEnemyDist = range;
  for (let e of enemies) { 
    const d = Math.hypot(e.x-player.x, e.y-player.y); 
    if(d < nearestEnemyDist){ nearestEnemyDist=d; nearestEnemy=e; } 
  }
  if (nearestEnemy) return { x: nearestEnemy.x, y: nearestEnemy.y };

  let nearestCube = null, nearestCubeDist = range;
  for (let c of powerCubes) {
    const d = Math.hypot(c.x - player.x, c.y - player.y);
    if (d < nearestCubeDist) { nearestCubeDist = d; nearestCube = c; }
  }
  if (nearestCube) return { x: nearestCube.x, y: nearestCube.y };

  return null;
}

function rectContains(el,x,y) { const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }

document.addEventListener('touchstart',e=>{
  e.preventDefault(); Sound.init();
  for (let t of e.changedTouches) {
    const cx=t.clientX,cy=t.clientY;
    if (moveTouchId===-1&&rectContains(moveEl,cx,cy)) {
      moveTouchId=t.identifier;
      const r=moveEl.getBoundingClientRect();
      moveJoystick.active=true; moveJoystick.originX=r.left+r.width/2; moveJoystick.originY=r.top+r.height/2;
      updateJoystick(cx,cy,moveJoystick,moveKnob,(x,y)=>{input.moveX=x;input.moveY=y;});
      continue;
    }
    if (atkTouchId===-1&&rectContains(atkEl,cx,cy)) {
      atkTouchId=t.identifier; atkStartX=cx; atkStartY=cy; atkDragged=false;
      const r=atkEl.getBoundingClientRect();
      attackJoystick.active=true; attackJoystick.originX=r.left+r.width/2; attackJoystick.originY=r.top+r.height/2;
    }
  }
},{passive:false});

document.addEventListener('touchmove',e=>{
  e.preventDefault();
  for (let t of e.changedTouches) {
    const cx=t.clientX,cy=t.clientY;
    if (t.identifier===moveTouchId) updateJoystick(cx,cy,moveJoystick,moveKnob,(x,y)=>{input.moveX=x;input.moveY=y;});
    if (t.identifier===atkTouchId) {
      if (Math.hypot(cx-atkStartX,cy-atkStartY)>TAP_THRESHOLD) atkDragged=true;
      if (atkDragged) updateJoystick(cx,cy,attackJoystick,atkKnob,(x,y)=>{
        input.aimX=x; input.aimY=y;
        if (x!==0||y!==0) player.angle=Math.atan2(y,x);
      });
    }
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier===moveTouchId) {
      moveTouchId=-1; moveJoystick.active=false;
      moveKnob.style.transform='translate(-50%,-50%)'; input.moveX=0; input.moveY=0;
    }
    if (t.identifier===atkTouchId) {
      atkTouchId=-1; attackJoystick.active=false;
      atkKnob.style.transform='translate(-50%,-50%)';
      if (!atkDragged) {
        const target = findAutoAimTarget();
        if (target) {
            const a=Math.atan2(target.y-player.y,target.x-player.x); 
            player.angle=a; 
            input.aimX=Math.cos(a); 
            input.aimY=Math.sin(a);
        }
        input.attacking=true; shoot(player,true,'single');
        setTimeout(()=>{ if(gameRunning) input.attacking=false; },80);
      } else {
        input.attacking=true; shoot(player,true,'single');
        setTimeout(()=>{ if(gameRunning){input.attacking=false;input.aimX=0;input.aimY=0;} },80);
      }
      atkDragged=false;
    }
  }
},{passive:false});

document.addEventListener('touchcancel',e=>{
  for (let t of e.changedTouches) {
    if (t.identifier===moveTouchId){moveTouchId=-1;moveJoystick.active=false;moveKnob.style.transform='translate(-50%,-50%)';input.moveX=0;input.moveY=0;}
    if (t.identifier===atkTouchId){atkTouchId=-1;attackJoystick.active=false;atkKnob.style.transform='translate(-50%,-50%)';input.attacking=false;atkDragged=false;}
  }
},{passive:false});

document.getElementById('soundToggle').addEventListener('click',()=>{Sound.init();Sound.toggle();});
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;Sound.init();});
window.addEventListener('keyup',  e=>keys[e.key]=false);
canvas.addEventListener('mousedown',()=>{Sound.init();input.attacking=true;});
canvas.addEventListener('mouseup',  ()=>input.attacking=false);
canvas.addEventListener('mousemove',e=>{
  if (!attackJoystick.active) {
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left+camera.x, my=e.clientY-rect.top+camera.y;
    player.angle=Math.atan2(my-player.y,mx-player.x);
    input.aimX=Math.cos(player.angle); input.aimY=Math.sin(player.angle);
  }
});

// ---------------------------------------------------------------------------
// Collision helpers
// ---------------------------------------------------------------------------
function checkWallCollision(x,y,radius) {
  for (let w of walls) {
    const cx=Math.max(w.x,Math.min(x,w.x+w.width)), cy=Math.max(w.y,Math.min(y,w.y+w.height));
    if (Math.hypot(x-cx,y-cy)<radius) return true;
  }
  return false;
}
function isInPoison(x,y) { return Math.hypot(x-MAP_SIZE/2,y-MAP_SIZE/2)>poisonZone.radius; }
function edgeMargin(x,y) { return poisonZone.radius-Math.hypot(x-MAP_SIZE/2,y-MAP_SIZE/2); }

// ---------------------------------------------------------------------------
// Shooting
// ---------------------------------------------------------------------------
function shoot(shooter, isPlayer, pattern='single') {
  const now=Date.now();
  if (shooter.ammo<=0){if(isPlayer)Sound.empty();return;}
  if (now-shooter.lastAttack<shooter.attackCooldown) return;
  shooter.ammo--; shooter.lastAttack=now; shooter.lastCombatTime=now;
  if (isPlayer){Sound.shoot();if(shooter.ammo===0)Sound.empty();}

  const baseSpeed=isPlayer?24:14;
  const damage=shooter.damage, ref=isPlayer?null:shooter;
  const sa=shooter.angle; 

  if (pattern==='single'||pattern==='sniper') {
    const spd=(pattern==='sniper'&&!isPlayer)?32:baseSpeed;
    projectiles.push({x:shooter.x, y:shooter.y, vx:Math.cos(sa)*spd,vy:Math.sin(sa)*spd,
      radius:isPlayer?6:8, damage, isPlayer, shooter:ref,
      color:isPlayer?'#00ff88':(pattern==='sniper'?'#ff0000':'#ff4444')});
  } else if (pattern==='shotgun') {
    for (let i=-2;i<=2;i++) {
      const a=sa+i*0.2;
      projectiles.push({x:shooter.x,y:shooter.y,vx:Math.cos(a)*baseSpeed,vy:Math.sin(a)*baseSpeed,radius:5,damage:damage*0.7,isPlayer,shooter:ref,color:'#ffaa00'});
    }
  } else if (pattern==='volley') {
    for (let i=0;i<5;i++) setTimeout(()=>{
      if (!gameRunning) return;
      if (!isPlayer && !enemies.includes(shooter)) return; 
      
      const a = shooter.angle + (i-2)*0.15; 
      projectiles.push({
        x: shooter.x, y: shooter.y, 
        vx: Math.cos(a)*baseSpeed, vy: Math.sin(a)*baseSpeed,
        radius:6, damage, isPlayer, shooter:ref, color:'#aa00ff'
      });
    },i*100);
  } else if (pattern==='rapid') {
    projectiles.push({x:shooter.x,y:shooter.y,vx:Math.cos(sa)*baseSpeed*1.3,vy:Math.sin(sa)*baseSpeed*1.3,radius:4,damage:damage*0.8,isPlayer,shooter:ref,color:'#00ffaa'});
  }
}

// ---------------------------------------------------------------------------
// Power cube collection
// ---------------------------------------------------------------------------
function collectPowerCube(entity) {
  entity.powerCubes++;
  entity.maxHealth+=20; entity.health=Math.min(entity.health+20,entity.maxHealth);
  entity.damage=entity.baseDamage*(1+entity.powerCubes*0.06);
  entity.radius=Math.min(entity.radius+0.5,40);
  if (entity===player) entity.ammo=entity.maxAmmo;
  Sound.collect();
  if (entity!==player) updateEnemyHealthBar();
  else document.getElementById('cubeCount').textContent=entity.powerCubes;
}

// ---------------------------------------------------------------------------
// applyMovement
// ---------------------------------------------------------------------------
function applyMovement(entity,vx,vy) {
  if (vx===0&&vy===0) return false;
  const r=entity.radius;
  const fx=entity.x+vx, fy=entity.y+vy;
  if (!checkWallCollision(fx,fy,r)) {
    entity.x=Math.max(r,Math.min(MAP_SIZE-r,fx));
    entity.y=Math.max(r,Math.min(MAP_SIZE-r,fy));
    entity.stuckTimer=0; return true;
  }
  let moved=false;
  const ox=entity.x+vx;
  if (!checkWallCollision(ox,entity.y,r)){entity.x=Math.max(r,Math.min(MAP_SIZE-r,ox));entity.stuckTimer=0;moved=true;}
  const oy=entity.y+vy;
  if (!checkWallCollision(entity.x,oy,r)){entity.y=Math.max(r,Math.min(MAP_SIZE-r,oy));entity.stuckTimer=0;moved=true;}
  if (moved) return true;

  entity.stuckTimer++;
  const bAngle=Math.atan2(vy,vx), spd=Math.hypot(vx,vy);
  for (let i=1;i<=24;i++) {
    const side=(i%2===0)?1:-1, off=Math.ceil(i/2)*(Math.PI/12);
    const ta=bAngle+side*off, tx=entity.x+Math.cos(ta)*spd, ty=entity.y+Math.sin(ta)*spd;
    if (!checkWallCollision(tx,ty,r)){entity.x=Math.max(r,Math.min(MAP_SIZE-r,tx));entity.y=Math.max(r,Math.min(MAP_SIZE-r,ty));entity.stuckTimer=0;return true;}
  }
  if (entity.stuckTimer>5) {
    for (let w of walls) {
      const cx=Math.max(w.x,Math.min(entity.x,w.x+w.width)), cy=Math.max(w.y,Math.min(entity.y,w.y+w.height));
      const dx=entity.x-cx, dy=entity.y-cy, d=Math.hypot(dx,dy);
      if (d<r&&d>0){entity.x+=(dx/d)*(r-d+1);entity.y+=(dy/d)*(r-d+1);entity.stuckTimer=0;break;}
    }
  }
  return false;
}

// ---------------------------------------------------------------------------
// moveEnemy
// ---------------------------------------------------------------------------
function moveEnemy(enemy,targetX,targetY,speed) {
  if (speed===0) return;

  if (enemy.inPoison) {
    const a=Math.atan2(MAP_SIZE/2-enemy.y,MAP_SIZE/2-enemy.x);
    applyMovement(enemy,Math.cos(a)*speed*1.4,Math.sin(a)*speed*1.4);
    return;
  }

  const dx=targetX-enemy.x, dy=targetY-enemy.y, dist=Math.hypot(dx,dy);
  let vx=dist>0?(dx/dist)*speed:0, vy=dist>0?(dy/dist)*speed:0;

  for (let other of enemies) {
    if (other===enemy) continue;
    const d=Math.hypot(other.x-enemy.x,other.y-enemy.y), minD=enemy.radius*3.5;
    if (d<minD&&d>0) {
      const pa=Math.atan2(enemy.y-other.y,enemy.x-other.x), force=(minD-d)/minD;
      vx+=Math.cos(pa)*force*speed*1.5; vy+=Math.sin(pa)*force*speed*1.5;
    }
  }

  vx+=(Math.random()-0.5)*0.3*speed; vy+=(Math.random()-0.5)*0.3*speed;

  const ts=Math.hypot(vx,vy);
  if (ts>speed*1.6){vx=(vx/ts)*speed*1.6;vy=(vy/ts)*speed*1.6;}

  applyMovement(enemy,vx,vy);
}

// ---------------------------------------------------------------------------
// fleeFrom - FIXED: Returns false if cornered (fight to death)
// ---------------------------------------------------------------------------
function fleeFrom(enemy, threatX, threatY) {
  const speed = enemy.speed * 1.1;
  const idealAngle = Math.atan2(enemy.y - threatY, enemy.x - threatX);
  let bestVx=0, bestVy=0, bestScore=-Infinity;
  const steps=24;
  for (let i=0;i<steps;i++) {
    const side=(i%2===0)?1:-1, off=Math.ceil(i/2)*(Math.PI/(steps/2));
    const a=idealAngle+side*off;
    const tx=enemy.x+Math.cos(a)*speed, ty=enemy.y+Math.sin(a)*speed;
    if (checkWallCollision(tx,ty,enemy.radius)) continue;
    const margin=edgeMargin(tx,ty);
    if (margin<0) continue; 
    const distFromThreat=Math.hypot(tx-threatX,ty-threatY);
    const score=distFromThreat - Math.abs(off)*80 + Math.min(margin,300)*0.3;
    if (score>bestScore){bestScore=score;bestVx=Math.cos(a)*speed;bestVy=Math.sin(a)*speed;}
  }
  const tx0=enemy.x+Math.cos(idealAngle)*speed, ty0=enemy.y+Math.sin(idealAngle)*speed;
  if (!checkWallCollision(tx0,ty0,enemy.radius)&&edgeMargin(tx0,ty0)>=0) {
    const d0=Math.hypot(tx0-threatX,ty0-threatY);
    if (d0>bestScore){bestVx=Math.cos(idealAngle)*speed;bestVy=Math.sin(idealAngle)*speed;}
  }

  if (bestScore === -Infinity) {
    return false; 
  }
  
  applyMovement(enemy,bestVx,bestVy);
  return true;
}

// ---------------------------------------------------------------------------
// Main update
// ---------------------------------------------------------------------------
function update() {
  if (!gameRunning) return;
  const now=Date.now();

  // Teaming Logic
  if (!update.nextTeamTick) update.nextTeamTick=now+8000;
  if (now>update.nextTeamTick) {
    const progress=Math.max(0,(10-enemies.length)/9);
    const teamChance=0.10 + 0.85 * Math.pow(progress, 1.5); 
    update.nextTeamTick=now+(10000-7000*progress);
    
    if (Math.random()<teamChance) {
      const solos=enemies.filter(e=>!e.teamId);
      if (solos.length>=3) {
        let seed = solos.find(e => e.health < e.maxHealth * 0.4 || e.powerCubes < 2);
        if (!seed) seed = solos[Math.floor(Math.random()*solos.length)];
        const nearby=solos.filter(e=>e!==seed&&Math.hypot(e.x-seed.x,e.y-seed.y)<3000).slice(0,2+Math.floor(Math.random()*2));
        if (nearby.length>=2) {
          const teamId='team_'+now;
          const members=[seed,...nearby];
          members.forEach(e=>{e.teamId=teamId;e.rivalTarget=null;e.rivalLockTimer=0;});
          const dur=(15000-7000*progress)+Math.random()*10000;
          setTimeout(()=>{ if(!gameRunning)return; members.forEach(e=>{if(enemies.includes(e)&&e.teamId===teamId)e.teamId=null;}); },dur);
        }
      }
    }
  }

  // Poison
  if (poisonZone.radius>poisonZone.minRadius) {
    poisonZone.shrinkDelay--;
    if (poisonZone.shrinkDelay<=0) {
      poisonZone.shrinking=true; poisonZone.radius-=poisonZone.shrinkRate;
      if (poisonZone.radius<MAP_SIZE*0.3&&!poisonZone.warning) {
        poisonZone.warning=true;
        document.getElementById('poisonWarning').style.display='block';
        setTimeout(()=>{if(!gameRunning)return;document.getElementById('poisonWarning').style.display='none';},3000);
      }
    }
  }
  document.getElementById('zoneSize').textContent=Math.round((poisonZone.radius/(MAP_SIZE*0.7))*100);

  // Player
  if (!moveJoystick.active) {
    input.moveX=0;input.moveY=0;
    if(keys['w']||keys['W'])input.moveY=-1;
    if(keys['s']||keys['S'])input.moveY=1;
    if(keys['a']||keys['A'])input.moveX=-1;
    if(keys['d']||keys['D'])input.moveX=1;
  }
  const mm=Math.hypot(input.moveX,input.moveY);
  const nmx=mm>0?input.moveX/mm:0, nmy=mm>0?input.moveY/mm:0;
  const newX=player.x+nmx*player.speed, newY=player.y+nmy*player.speed;
  if(!checkWallCollision(newX,player.y,player.radius)) player.x=Math.max(player.radius,Math.min(MAP_SIZE-player.radius,newX));
  if(!checkWallCollision(player.x,newY,player.radius)) player.y=Math.max(player.radius,Math.min(MAP_SIZE-player.radius,newY));

  camera.x=Math.max(0,Math.min(MAP_SIZE-canvas.width, player.x-canvas.width/2));
  camera.y=Math.max(0,Math.min(MAP_SIZE-canvas.height,player.y-canvas.height/2));

  if(input.aimX!==0||input.aimY!==0) player.angle=Math.atan2(input.aimY,input.aimX);
  if(input.attacking) shoot(player,true,'single');

  if(player.health<player.maxHealth&&!player.inPoison&&now-player.lastCombatTime>3000)
    player.health=Math.min(player.maxHealth,player.health+0.5);

  if(player.ammo<player.maxAmmo){player.reloadTimer++;if(player.reloadTimer>=player.reloadTime){player.ammo++;player.reloadTimer=0;Sound.reload();}}

  player.inPoison=isInPoison(player.x,player.y);
  if(player.inPoison){
    player.health-=poisonZone.damage;
    if(Math.random()<0.1)Sound.poison();
    if(player.health<=0){gameRunning=false;document.getElementById('gameOverText').textContent='KILLED BY POISON';document.getElementById('gameOver').style.display='flex';}
  }
  document.getElementById('lowHealthWarning').style.display=(player.health/player.maxHealth<0.3&&player.health>0)?'block':'none';

  // Enemies
  for (let i=enemies.length-1;i>=0;i--) {
    const enemy=enemies[i];

    if(enemy.health<enemy.maxHealth&&!enemy.inPoison&&now-enemy.lastCombatTime>3500)
      enemy.health=Math.min(enemy.maxHealth,enemy.health+0.35);

    if(enemy.ammo<enemy.maxAmmo){enemy.reloadTimer++;if(enemy.reloadTimer>=enemy.reloadTime){enemy.ammo++;enemy.reloadTimer=0;}}

    enemy.inPoison=isInPoison(enemy.x,enemy.y);
    if(enemy.inPoison) enemy.health-=poisonZone.damage;

    const distToPlayer=Math.hypot(player.x-enemy.x,player.y-enemy.y);
    const sightRange=enemy.sightRange||500;

    if (enemy.inPoison) {
      enemy.state='flee_storm';
      moveEnemy(enemy,MAP_SIZE/2,MAP_SIZE/2,enemy.speed*1.4);
      enemy.angle=Math.atan2(MAP_SIZE/2-enemy.y,MAP_SIZE/2-enemy.x);
    } else if (enemy.health<enemy.maxHealth*0.3) {
      let threatX=player.x, threatY=player.y;
      if (enemy.rivalTarget&&enemies.includes(enemy.rivalTarget)) {
        const dRival=Math.hypot(enemy.rivalTarget.x-enemy.x,enemy.rivalTarget.y-enemy.y);
        if (dRival<distToPlayer){threatX=enemy.rivalTarget.x;threatY=enemy.rivalTarget.y;}
      }
      
      const escaped = fleeFrom(enemy, threatX, threatY);
      if (!escaped) {
         enemy.state = 'attack';
         enemy.angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
         shoot(enemy, false, enemy.attackPattern);
         moveEnemy(enemy, player.x, player.y, enemy.speed); 
      } else {
         enemy.state = 'flee';
         enemy.angle = Math.atan2(enemy.y-threatY, enemy.x-threatX);
      }

    } else if (distToPlayer<sightRange) {
      enemy.state='attack';
      const preferredDist=enemy.name==='Sniper'?600:200;
      if (distToPlayer>preferredDist) {
        moveEnemy(enemy,player.x,player.y,enemy.speed);
      } else if (enemy.name==='Sniper'&&distToPlayer<400) {
        const ba=Math.atan2(enemy.y-player.y,enemy.x-player.x);
        moveEnemy(enemy,enemy.x+Math.cos(ba)*200,enemy.y+Math.sin(ba)*200,enemy.speed);
      } else {
        moveEnemy(enemy,enemy.x,enemy.y,0);
      }
      enemy.angle=Math.atan2(player.y-enemy.y,player.x-enemy.x);
      shoot(enemy,false,enemy.attackPattern);
    } else {
      if(enemy.rivalLockTimer>0) enemy.rivalLockTimer--;
      if(enemy.rivalTarget&&!enemies.includes(enemy.rivalTarget)){enemy.rivalTarget=null;enemy.rivalLockTimer=0;}

      let nearestCube=null, nearestCubeDist=3000;
      for(let cube of powerCubes){const d=Math.hypot(cube.x-enemy.x,cube.y-enemy.y);if(d<nearestCubeDist){nearestCubeDist=d;nearestCube=cube;}}
      let nearestBox=null, nearestBoxDist=Infinity;
      const BOX_SHOOT=350;
      for(let box of boxes){const bx=box.x+box.width/2,by=box.y+box.height/2;const d=Math.hypot(bx-enemy.x,by-enemy.y);if(d<nearestBoxDist){nearestBoxDist=d;nearestBox=box;}}

      function shootAtNearestThreat() {
        if(distToPlayer<sightRange){enemy.angle=Math.atan2(player.y-enemy.y,player.x-enemy.x);shoot(enemy,false,enemy.attackPattern);return;}
        for(let other of enemies){
          if(other===enemy)continue;
          if(enemy.teamId&&other.teamId===enemy.teamId)continue;
          const d=Math.hypot(other.x-enemy.x,other.y-enemy.y);
          if(d<sightRange){enemy.angle=Math.atan2(other.y-enemy.y,other.x-enemy.x);shoot(enemy,false,enemy.attackPattern);return;}
        }
        if(nearestBox&&nearestBoxDist<BOX_SHOOT){const bx=nearestBox.x+nearestBox.width/2,by=nearestBox.y+nearestBox.height/2;enemy.angle=Math.atan2(by-enemy.y,bx-enemy.x);shoot(enemy,false,enemy.attackPattern);}
      }

      if(nearestCube&&nearestCubeDist<400){
        enemy.state='roam'; enemy.rivalTarget=null; enemy.rivalLockTimer=0;
        moveEnemy(enemy,nearestCube.x,nearestCube.y,enemy.speed*1.1);
        enemy.angle=Math.atan2(nearestCube.y-enemy.y,nearestCube.x-enemy.x);
        shootAtNearestThreat();
      } else {
        if(!enemy.rivalTarget||enemy.rivalLockTimer<=0){
          let bestRival=null, bestScore=-Infinity;
          for(let other of enemies){
            if(other===enemy)continue;
            if(enemy.teamId&&other.teamId===enemy.teamId)continue;
            const d=Math.hypot(other.x-enemy.x,other.y-enemy.y);
            if(d>2500)continue;
            const score=other.powerCubes*300-d;
            if(score>bestScore){bestScore=score;bestRival=other;}
          }
          enemy.rivalTarget=(bestScore>-800)?bestRival:null;
          enemy.rivalLockTimer=150+Math.floor(Math.random()*100);
        }

        if(enemy.rivalTarget){
          if(nearestCube&&nearestCubeDist<1200){
            enemy.state='roam'; enemy.rivalTarget=null; enemy.rivalLockTimer=0;
            moveEnemy(enemy,nearestCube.x,nearestCube.y,enemy.speed*1.1);
            enemy.angle=Math.atan2(nearestCube.y-enemy.y,nearestCube.x-enemy.x);
            shootAtNearestThreat();
          } else {
            enemy.state='infight';
            const rt=enemy.rivalTarget, dr=Math.hypot(rt.x-enemy.x,rt.y-enemy.y);
            if(dr>220) moveEnemy(enemy,rt.x,rt.y,enemy.speed);
            enemy.angle=Math.atan2(rt.y-enemy.y,rt.x-enemy.x);
            shoot(enemy,false,enemy.attackPattern);
          }
        } else {
          enemy.state='roam';
          if(nearestBox&&nearestBoxDist<BOX_SHOOT){
            const bx=nearestBox.x+nearestBox.width/2,by=nearestBox.y+nearestBox.height/2;
            moveEnemy(enemy,bx,by,enemy.speed); enemy.angle=Math.atan2(by-enemy.y,bx-enemy.x);
            shoot(enemy,false,enemy.attackPattern);
          } else if(nearestCube){
            moveEnemy(enemy,nearestCube.x,nearestCube.y,enemy.speed);
            enemy.angle=Math.atan2(nearestCube.y-enemy.y,nearestCube.x-enemy.x);
            shootAtNearestThreat();
          } else if(nearestBox&&nearestBoxDist<1200){
            const bx=nearestBox.x+nearestBox.width/2,by=nearestBox.y+nearestBox.height/2;
            moveEnemy(enemy,bx,by,enemy.speed); enemy.angle=Math.atan2(by-enemy.y,bx-enemy.x);
            shootAtNearestThreat();
          } else {
            enemy.roamTimer--;
            if(enemy.roamTimer<=0){
              const a=enemy.spreadAngle+(Math.random()-0.5)*0.5, d=Math.random()*(poisonZone.radius*0.7);
              enemy.roamTarget={x:MAP_SIZE/2+Math.cos(a)*d, y:MAP_SIZE/2+Math.sin(a)*d};
              enemy.roamTimer=200+Math.random()*200; enemy.spreadAngle+=0.3;
            }
            moveEnemy(enemy,enemy.roamTarget.x,enemy.roamTarget.y,enemy.speed);
            enemy.angle=Math.atan2(enemy.roamTarget.y-enemy.y,enemy.roamTarget.x-enemy.x);
            shootAtNearestThreat();
          }
        }
      }
    }

    if(enemy.health<=0){
      Sound.enemyDeath();
      const drops=Math.max(1,enemy.powerCubes);
      for(let c=0;c<drops;c++) spawnPowerCube(enemy.x+(Math.random()-0.5)*80,enemy.y+(Math.random()-0.5)*80);
      enemies.splice(i,1);
      document.getElementById('enemyCount').textContent=enemies.length;
      if(enemies.length===0) setTimeout(()=>{if(!gameRunning)return;document.getElementById('gameOverText').textContent='🏆 VICTORY! 🏆';document.getElementById('gameOver').style.display='flex';gameRunning=false;},500);
    }
  }

  // Projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const proj=projectiles[i];
    proj.x+=proj.vx; proj.y+=proj.vy;
    if(checkWallCollision(proj.x,proj.y,proj.radius)||proj.x<0||proj.x>MAP_SIZE||proj.y<0||proj.y>MAP_SIZE){projectiles.splice(i,1);continue;}

    // Logic: Projectiles break Boxes (Cubes). Projectiles pass through Power Cubes (Orbs).
    // Player must walk over Power Cubes to collect.

    let hitBox=false;
    for(let b=boxes.length-1;b>=0;b--){
      const box=boxes[b];
      if(proj.x>box.x&&proj.x<box.x+box.width&&proj.y>box.y&&proj.y<box.y+box.height){
        box.health-=proj.damage; projectiles.splice(i,1); hitBox=true;
        if(box.health<=0){
          Sound.boxBreak(); boxes.splice(b,1);
          setTimeout(()=>{if(!gameRunning)return;spawnPowerCube(box.x+box.width/2+(Math.random()-0.5)*50,box.y+box.height/2+(Math.random()-0.5)*50);},0);
          setTimeout(()=>{if(!gameRunning)return;spawnBox();},7500);
        }
        break;
      }
    }
    if(hitBox)continue;

    if(proj.isPlayer){
      for(let enemy of enemies){
        if(Math.hypot(proj.x-enemy.x,proj.y-enemy.y)<enemy.radius+proj.radius){
          enemy.health-=proj.damage; enemy.lastCombatTime=now; Sound.hit(); projectiles.splice(i,1); break;
        }
      }
    } else {
      if(Math.hypot(proj.x-player.x,proj.y-player.y)<player.radius+proj.radius){
        player.health-=proj.damage; player.lastCombatTime=now; Sound.hit(); projectiles.splice(i,1);
        if(player.health<=0&&!player.inPoison){gameRunning=false;document.getElementById('gameOverText').textContent='GAME OVER';document.getElementById('gameOver').style.display='flex';}
        continue;
      }
      let hitEnemy=false;
      for(let other of enemies){
        if(other===proj.shooter)continue;
        if(proj.shooter&&proj.shooter.teamId&&proj.shooter.teamId===other.teamId)continue;
        if(Math.hypot(proj.x-other.x,proj.y-other.y)<other.radius+proj.radius){
          other.health-=proj.damage*0.6; other.lastCombatTime=now;
          if(proj.shooter&&enemies.includes(proj.shooter)){other.rivalTarget=proj.shooter;other.rivalLockTimer=300;}
          projectiles.splice(i,1); hitEnemy=true; break;
        }
      }
      if(hitEnemy)continue;
    }
  }

  // Pickup (Walking over cubes)
  for(let i=powerCubes.length-1;i>=0;i--){
    const cube=powerCubes[i];
    if(Math.hypot(cube.x-player.x,cube.y-player.y)<player.radius+cube.radius+10){collectPowerCube(player);powerCubes.splice(i,1);continue;}
    for(let enemy of enemies){
      if(Math.hypot(cube.x-enemy.x,cube.y-enemy.y)<enemy.radius+cube.radius+10){collectPowerCube(enemy);powerCubes.splice(i,1);break;}
    }
  }

  updateEnemyHealthBar();
}

function updateEnemyHealthBar() {
  let maxH=0,maxMH=100,maxN='';
  for(let e of enemies){if(e.health>maxH){maxH=e.health;maxMH=e.maxHealth;maxN=e.name;}}
  if(maxMH>0){
    document.getElementById('enemyHealthBar').style.width=(maxH/maxMH*100)+'%';
    document.getElementById('enemyName').textContent=maxN+(enemies.length>1?` (+${enemies.length-1})`:'');
  } else {
    document.getElementById('enemyHealthBar').style.width='0%';
    document.getElementById('enemyName').textContent='No Enemies';
  }
}

// ---------------------------------------------------------------------------
// Draw
// ---------------------------------------------------------------------------
function draw() {
  ctx.fillStyle='#2d5a27'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(-camera.x,-camera.y);

  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1;
  for(let x=0;x<=MAP_SIZE;x+=TILE_SIZE){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MAP_SIZE);ctx.stroke();}
  for(let y=0;y<=MAP_SIZE;y+=TILE_SIZE){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MAP_SIZE,y);ctx.stroke();}

  ctx.fillStyle='rgba(128,0,128,0.3)';
  ctx.beginPath(); ctx.rect(camera.x,camera.y,canvas.width,canvas.height);
  ctx.arc(MAP_SIZE/2,MAP_SIZE/2,poisonZone.radius,0,Math.PI*2,true); ctx.fill();
  ctx.strokeStyle='#ff00ff'; ctx.lineWidth=5; ctx.setLineDash([20,10]);
  ctx.beginPath(); ctx.arc(MAP_SIZE/2,MAP_SIZE/2,poisonZone.radius,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle='#5d4e37'; ctx.strokeStyle='#3d3227'; ctx.lineWidth=3;
  for(let w of walls){
    if(w.x+w.width>camera.x&&w.x<camera.x+canvas.width&&w.y+w.height>camera.y&&w.y<camera.y+canvas.height){
      ctx.fillRect(w.x,w.y,w.width,w.height); ctx.strokeRect(w.x,w.y,w.width,w.height);
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(w.x,w.y+w.height-10,w.width,10); ctx.fillStyle='#5d4e37';
    }
  }

  for(let box of boxes){
    ctx.fillStyle='#8B4513'; ctx.fillRect(box.x,box.y,box.width,box.height);
    ctx.strokeStyle='#5D2906'; ctx.lineWidth=2; ctx.strokeRect(box.x,box.y,box.width,box.height);
    ctx.beginPath(); ctx.moveTo(box.x,box.y); ctx.lineTo(box.x+box.width,box.y+box.height);
    ctx.moveTo(box.x+box.width,box.y); ctx.lineTo(box.x,box.y+box.height); ctx.strokeStyle='#5D2906'; ctx.stroke();
    const hp=box.health/box.maxHealth;
    ctx.fillStyle='#000'; ctx.fillRect(box.x-5,box.y-15,50,8);
    ctx.fillStyle=hp>0.6?'#00ff00':hp>0.3?'#ffff00':'#ff0000'; ctx.fillRect(box.x-5,box.y-15,50*hp,8);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(box.x-5,box.y-15,50,8);
  }

  const t=Date.now()/200;
  for(let cube of powerCubes){
    const fy=Math.sin(t+cube.floatOffset)*5;
    const g=ctx.createRadialGradient(cube.x,cube.y+fy,0,cube.x,cube.y+fy,cube.radius+10);
    g.addColorStop(0,'rgba(255,204,0,0.8)'); g.addColorStop(1,'rgba(255,204,0,0)');
    ctx.beginPath(); ctx.arc(cube.x,cube.y+fy,cube.radius+10,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(cube.x,cube.y+fy,cube.radius,0,Math.PI*2);
    ctx.fillStyle='#ffcc00'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(cube.x,cube.y+fy,cube.radius*0.5,0,Math.PI*2); ctx.fillStyle='#ffdd44'; ctx.fill();
  }

  if(input.aimX!==0||input.aimY!==0){
    ctx.beginPath(); ctx.moveTo(player.x,player.y);
    ctx.lineTo(player.x+Math.cos(player.angle)*100,player.y+Math.sin(player.angle)*100);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
  }

  for(let proj of projectiles){
    ctx.beginPath(); ctx.arc(proj.x,proj.y,proj.radius,0,Math.PI*2);
    ctx.fillStyle=proj.color; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(proj.x,proj.y); ctx.lineTo(proj.x-proj.vx*3,proj.y-proj.vy*3);
    ctx.strokeStyle=proj.color+'80'; ctx.lineWidth=proj.radius; ctx.stroke();
  }

  const nd=Date.now();
  for(let enemy of enemies){
    if(enemy.inPoison){ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+5,0,Math.PI*2);ctx.strokeStyle='#ff00ff';ctx.lineWidth=3;ctx.stroke();}
    if(enemy.health<enemy.maxHealth&&!enemy.inPoison&&nd-enemy.lastCombatTime>3500){
      const pulse=0.5+0.5*Math.sin(nd/100);
      ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+8,0,Math.PI*2);ctx.strokeStyle=`rgba(0,255,0,${pulse})`;ctx.lineWidth=2;ctx.stroke();
    }
    if(enemy.teamId){
      const pulse=0.6+0.4*Math.sin(nd/300);
      ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+9,0,Math.PI*2);ctx.strokeStyle=`rgba(255,165,0,${pulse})`;ctx.lineWidth=3;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(enemy.x+3,enemy.y+3,enemy.radius,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
    ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius,0,Math.PI*2);ctx.fillStyle=enemy.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.moveTo(enemy.x,enemy.y);ctx.lineTo(enemy.x+Math.cos(enemy.angle)*enemy.radius*1.3,enemy.y+Math.sin(enemy.angle)*enemy.radius*1.3);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();
    if(enemy.powerCubes>0){ctx.fillStyle='#ffcc00';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(`📦${enemy.powerCubes}`,enemy.x,enemy.y-enemy.radius-10);}
    if(enemy.teamId){const pulse=0.6+0.4*Math.sin(nd/300);ctx.fillStyle=`rgba(255,165,0,${pulse})`;ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('TEAM',enemy.x,enemy.y-enemy.radius-22);}
    ctx.fillStyle='#000';ctx.fillRect(enemy.x-20,enemy.y-enemy.radius-15,40,6);
    ctx.fillStyle='#ff4444';ctx.fillRect(enemy.x-20,enemy.y-enemy.radius-15,40*(enemy.health/enemy.maxHealth),6);
  }

  if(player.inPoison){ctx.beginPath();ctx.arc(player.x,player.y,player.radius+5,0,Math.PI*2);ctx.strokeStyle='#ff00ff';ctx.lineWidth=3;ctx.stroke();}
  ctx.beginPath();ctx.arc(player.x+3,player.y+3,player.radius,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
  ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fillStyle=player.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(player.angle)*player.radius*1.5,player.y+Math.sin(player.angle)*player.radius*1.5);ctx.strokeStyle='#00ff88';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.arc(player.x,player.y,player.radius*0.6,0,Math.PI*2);ctx.fillStyle='#00d4ff';ctx.fill();

  const hbx=player.x-30,hby=player.y-player.radius-45;
  ctx.fillStyle='#000';ctx.fillRect(hbx,hby,60,8);
  ctx.fillStyle='#00ff88';ctx.fillRect(hbx,hby,60*(player.health/player.maxHealth),8);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(hbx,hby,60,8);

  const aw=8,ah=4,as=2, taw=player.maxAmmo*aw+(player.maxAmmo-1)*as;
  const abx=player.x-taw/2, aby=player.y-player.radius-25;
  for(let i=0;i<player.maxAmmo;i++){
    const bx=abx+i*(aw+as);
    ctx.fillStyle=i<player.ammo?'#00ff88':'#555'; ctx.fillRect(bx,aby,aw,ah);
    if(i===player.ammo&&player.reloadTimer>0){const p=player.reloadTimer/player.reloadTime;ctx.fillStyle='#00ff88';ctx.fillRect(bx,aby+ah*(1-p),aw,ah*p);}
  }
  if(player.powerCubes>0){ctx.fillStyle='#ffcc00';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText(`📦${player.powerCubes}`,player.x,player.y-player.radius-55);}

  ctx.restore();
  drawMinimap();
}

function drawMinimap() {
  minimapCtx.fillStyle='#1a3a1a'; minimapCtx.fillRect(0,0,150,150);
  const scale=150/MAP_SIZE;
  minimapCtx.beginPath(); minimapCtx.arc(75,75,poisonZone.radius*scale,0,Math.PI*2);
  minimapCtx.fillStyle='rgba(128,0,128,0.3)'; minimapCtx.fill();
  minimapCtx.strokeStyle='#ff00ff'; minimapCtx.lineWidth=2; minimapCtx.stroke();
  minimapCtx.fillStyle='#3d3227';
  for(let w of walls) minimapCtx.fillRect(w.x*scale,w.y*scale,w.width*scale,w.height*scale);
  minimapCtx.fillStyle='#8B4513';
  for(let box of boxes) minimapCtx.fillRect(box.x*scale,box.y*scale,box.width*scale,box.height*scale);
  minimapCtx.fillStyle='#ffcc00';
  for(let cube of powerCubes){minimapCtx.beginPath();minimapCtx.arc(cube.x*scale,cube.y*scale,3,0,Math.PI*2);minimapCtx.fill();}
  minimapCtx.fillStyle='#ff4444';
  for(let e of enemies){minimapCtx.beginPath();minimapCtx.arc(e.x*scale,e.y*scale,3,0,Math.PI*2);minimapCtx.fill();}
  minimapCtx.fillStyle='#00ff88';
  minimapCtx.beginPath(); minimapCtx.arc(player.x*scale,player.y*scale,4,0,Math.PI*2); minimapCtx.fill();
  minimapCtx.strokeStyle='#fff'; minimapCtx.lineWidth=1;
  minimapCtx.strokeRect(camera.x*scale,camera.y*scale,canvas.width*scale,canvas.height*scale);
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
document.getElementById('restartBtn').addEventListener('click',()=>location.reload());
gameLoop();
</script>
